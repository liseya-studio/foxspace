name: Sync public feed sources
on:
  push:
    branches: [main]
    paths:
      - scripts/sync_public_feed.py
      - .github/workflows/feed-sync.yml
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: sync-public-feed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: pip install beautifulsoup4
      - name: Fetch public posts
        env:
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
        run: python scripts/sync_public_feed.py
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/feed.json
          git diff --cached --quiet || (git commit -m "chore(feed): refresh public posts" && git push)
