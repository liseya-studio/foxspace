name: Browser smoke tests and screenshots
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test desktop UI
        run: npm run test:e2e
      - name: Upload screenshots and trace report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fox-space-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
