name: Build Fox Space for macOS Apple Silicon
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/features/storage/persistence.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/macos.yml"
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Generate app icons
        run: npm run tauri:icons
      - name: Build Apple Silicon DMG
        run: npx tauri build --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: fox-space-macos-aarch64-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
