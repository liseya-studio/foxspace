name: Build Fox Space for macOS Apple Silicon
on:
  workflow_dispatch:
  push:
    branches: [main, macos-integrations]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/macos.yml"
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Generate app icons
        run: npm run tauri:icons
      - name: Build Apple Silicon DMG
        run: npx tauri build --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: Fox-Space-macOS-Apple-Silicon
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Launch bundled app and verify native storage
        shell: bash
        run: |
          app="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name 'Fox Space.app' -print -quit)"
          test -n "$app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")"
          "$app/Contents/MacOS/$executable" > "$RUNNER_TEMP/foxspace-app.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          snapshot="$HOME/Library/Application Support/studio.liseya.foxspace/workspace.json"
          for attempt in $(seq 1 45); do
            if python3 -c 'import json,sys; assert "fox-screens" in json.load(open(sys.argv[1]))' "$snapshot" 2>/dev/null; then
              echo "The bundled WKWebView rendered Fox Space and saved its native workspace."
              exit 0
            fi
            kill -0 "$app_pid" || break
            sleep 1
          done
          cat "$RUNNER_TEMP/foxspace-app.log"
          exit 1
